name: Build and Deploy
on:
  pull_request:
    branches:
      - master 
  push:
    branches:
      - master 
env:
  APP_NAME: GoogleApi
  VERSION: 5.8.19
  NUGET_HOST: https://api.nuget.org/v3/index.json
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: ${{ github.repository }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Build and Test
        shell: pwsh
        run: |
          dotnet build -c Release .\$env:APP_NAME.sln;
          if ($LastExitCode -ne 0)
          { 
              throw "Build failed";
          };

          dotnet test .\.tests\UnitTests.$env:APP_NAME\UnitTests.$env:APP_NAME.csproj --framework net9.0
          if ($LastExitCode -ne 0)
          { 
              throw "Tests failed";
          };

          dotnet pack --output nupkgs /p:PackageVersion=$env:VERSION;
          if ($LastExitCode -ne 0)
          { 
              throw "Pack failed";
          };

      - name: NuGet Login (Trusted Publishing)
        if: github.ref == 'refs/heads/master'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: vivet

      - name: Push NuGet
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          dotnet nuget push "nupkgs/*.nupkg" -s $env:NUGET_HOST -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

          if ($LastExitCode -ne 0)
          { 
              throw "Publish failed";
          };

      - name: GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: |
            Version: ${{ env.VERSION }}
            Commit: ${{ github.sha }}
          artifacts: "nupkgs/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false